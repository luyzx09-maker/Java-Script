<html lang=pt-br'>

<body>
    <script>
    let peso=parseInt(prompt("Digite o PESO"));
    let Altura=parseInt(prompt("Digite a ALTURA"));
    let imc= Peso /(Altura * Altura);
    if(imc< 18.5){
        alert("Abaixo do peso");
    }else if(imc>=18.5 && imc<=24.9){
            alert("Normal");
        }else if(imc>= 25 && imc<=29.9){
            alert("Sobrepeso");
    }else{
                alert("Obeso")
            }
    </script>
</body>
